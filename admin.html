<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CricWorld Admin</title><style>:root{font-family:Arial,sans-serif;color:#eef9ef;background:#071b13}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:30px auto;padding:20px}.panel{background:#102d20;border:1px solid #2b5439;border-radius:16px;padding:24px;margin:18px 0}h1,h2{color:#c9f68d}label{display:block;margin:12px 0 6px}input,textarea,select{width:100%;padding:12px;border-radius:8px;border:1px solid #477652;background:#071b13;color:#eef9ef;font:inherit}textarea{min-height:120px}.button{background:#c9f68d;color:#102a19;border:0;border-radius:8px;padding:12px 16px;font-weight:800;cursor:pointer;margin:12px 8px 0 0}.status{color:#c9f68d;white-space:pre-wrap}a{color:#c9f68d}.small{color:#b3cbb8}</style></head><body><main class="wrap"><p><a href="./">← CricWorld website</a></p><h1>🏏 CricWorld Admin</h1><section class="panel"><h2>Admin sign in</h2><p class="small">Use your own authorized Supabase account. Do not share your password with anyone.</p><form id="login-form"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button class="button" type="submit">Sign in</button></form><p class="status" id="status" role="status"></p></section><section class="panel" id="manager" hidden><h2>Manage news</h2><button class="button" id="logout" type="button">Sign out</button><form id="news-form"><input id="article-id" type="hidden"><label for="title">Headline</label><input id="title" maxlength="250" required><label for="summary">Short summary</label><textarea id="summary"></textarea><label for="content">Full story</label><textarea id="content" required></textarea><label for="category">Category</label><select id="category"><option>International</option><option>Pakistan Cricket</option><option>Leagues</option><option>Player Stories</option><option>Cricket</option></select><label for="image-url">Image URL (optional)</label><input id="image-url" type="url"><label><input id="published" type="checkbox" style="width:auto"> Publish this story</label><button class="button" type="submit">Save story</button><button class="button" id="clear" type="button">Clear form</button></form><h2>Existing stories</h2><div id="news-list"></div></section><script src="./config.js"></script><script src="./admin.js"></script></main></body></html>
